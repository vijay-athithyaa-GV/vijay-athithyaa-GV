<svg xmlns="http://www.w3.org/2000/svg" width="860" height="110" viewBox="0 0 860 110"
     role="img" aria-label="Vijay Athithyaa G V">
  <title>Vijay Athithyaa G V</title>

  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop class="c1" offset="0"   stop-color="#0D9488"/>
      <stop class="c2" offset="0.5" stop-color="#0F766E"/>
      <stop class="c3" offset="1"   stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop class="r1" offset="0"    stop-color="#0D9488" stop-opacity="0"/>
      <stop class="r2" offset="0.5"  stop-color="#0D9488" stop-opacity="0.9"/>
      <stop class="r3" offset="1"    stop-color="#0D9488" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .name {
      font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont,
                   'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 54px;
      font-weight: 800;
      letter-spacing: 2.5px;
    }
    /* Deep teal by default reads on white; brighten to mint when the
       viewer is on a dark theme. */
    @media (prefers-color-scheme: dark) {
      .c1, .c3 { stop-color: #7FE7C4; }
      .c2      { stop-color: #B8F2E6; }
      .r1, .r2, .r3 { stop-color: #B8F2E6; }
    }
  </style>

  <text class="name" x="430" y="62" text-anchor="middle" fill="url(#nameGrad)">Vijay Athithyaa G V</text>
  <rect x="215" y="82" width="430" height="3" rx="1.5" fill="url(#ruleGrad)"/>
</svg>
